<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GUBER Mascot — 3D Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d0d0d; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  #header { padding: 12px 20px; background: #1a1a2e; border-bottom: 1px solid #6A00FF; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  #header h1 { font-size: 18px; color: #6A00FF; letter-spacing: 2px; }
  #header span { color: #39FF14; font-size: 12px; }
  #main { display: flex; flex: 1; overflow: hidden; }
  #canvas-wrap { flex: 1; position: relative; }
  canvas { display: block; width: 100% !important; height: 100% !important; }
  #sidebar { width: 220px; background: #111; padding: 16px; overflow-y: auto; flex-shrink: 0; }
  .section-title { font-size: 11px; letter-spacing: 2px; color: #6A00FF; margin: 16px 0 8px; text-transform: uppercase; }
  .btn { display: block; width: 100%; padding: 8px 12px; margin-bottom: 6px; background: #1a1a2e; border: 1px solid #333; border-radius: 6px; color: #ccc; font-size: 13px; cursor: pointer; text-align: left; transition: all 0.15s; }
  .btn:hover { border-color: #6A00FF; color: #fff; background: #1e0052; }
  .btn.active { border-color: #39FF14; color: #39FF14; background: #0a1a0a; }
  #status { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 6px 16px; border-radius: 20px; font-size: 12px; color: #aaa; pointer-events: none; }
  .slider-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .slider-row label { font-size: 11px; color: #888; width: 70px; flex-shrink: 0; }
  input[type=range] { flex: 1; accent-color: #6A00FF; }
  #anim-talk { background: #1e0052; border-color: #6A00FF; color: #a060ff; }
  #anim-talk.active { background: #2a0080; border-color: #39FF14; color: #39FF14; }
</style>
</head>
<body>
<div id="header">
  <h1>G U B E R</h1>
  <span>Mascot 3D Preview — VRM Ready</span>
</div>
<div id="main">
  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="status">Loading model…</div>
  </div>
  <div id="sidebar">
    <div class="section-title">Expressions</div>
    <button class="btn" data-morph="Blink_L">👁 Blink Left</button>
    <button class="btn" data-morph="Blink_R">👁 Blink Right</button>
    <button class="btn" data-morph="Joy">😄 Joy / Smile</button>
    <button class="btn" data-morph="Surprised">😲 Surprised</button>
    <button class="btn" data-morph="A">👄 Mouth Open (A)</button>
    <button class="btn" data-morph="O">😮 Mouth Round (O)</button>

    <div class="section-title">Animations</div>
    <button class="btn" id="anim-talk">🎙 Auto-Talk Loop</button>
    <button class="btn" id="anim-blink">👀 Auto-Blink</button>
    <button class="btn" id="anim-reset">↺ Reset All</button>

    <div class="section-title">View</div>
    <button class="btn" data-cam="front">Front</button>
    <button class="btn" data-cam="side">Side</button>
    <button class="btn" data-cam="top">Top</button>
    <button class="btn" id="toggle-rotate">⟳ Auto-Rotate</button>

    <div class="section-title">Skeleton</div>
    <button class="btn" id="toggle-skeleton">Show Bones</button>

    <div class="section-title">Morph Strength</div>
    <div class="slider-row"><label>Intensity</label><input type="range" id="morph-strength" min="0" max="100" value="100"></div>

    <div class="section-title">Files</div>
    <a class="btn" href="GUBER_mascot.vrm" download>⬇ Download .vrm</a>
    <a class="btn" href="GUBER_mascot_rigged.glb" download>⬇ Download .glb</a>
    <a class="btn" href="GUBER_VRM_Spec.md" download>⬇ Rigging Spec</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { SkeletonHelper } from 'three';

const canvas = document.getElementById('c');
const status = document.getElementById('status');

// Renderer
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0d0d);

// Lights
const ambLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambLight);
const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
keyLight.position.set(-2, 3, 4);
keyLight.castShadow = true;
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0x6A00FF, 0.5);
rimLight.position.set(2, -1, -3);
scene.add(rimLight);
const fillLight = new THREE.DirectionalLight(0x39FF14, 0.2);
fillLight.position.set(3, 2, -2);
scene.add(fillLight);

// Camera
const camera = new THREE.PerspectiveCamera(40, 1, 0.001, 100);
camera.position.set(0, 0, 2.5);

// Controls
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0, 0);
let autoRotate = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;

// Resize
function resize() {
  const wrap = canvas.parentElement;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas.parentElement);
resize();

// Load GLB
let mixer, morphMeshes = [], skeletonHelper = null, modelRoot = null;
const loader = new GLTFLoader();

loader.load('./GUBER_mascot_rigged.glb', gltf => {
  modelRoot = gltf.scene;

  // Center model
  const box = new THREE.Box3().setFromObject(modelRoot);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  modelRoot.position.sub(center);
  const maxDim = Math.max(size.x, size.y, size.z);
  const scale = 1.6 / maxDim;
  modelRoot.scale.setScalar(scale);
  scene.add(modelRoot);

  // Collect meshes with morph targets
  modelRoot.traverse(obj => {
    if (obj.isMesh && obj.morphTargetDictionary) {
      morphMeshes.push(obj);
      if (!obj.morphTargetInfluences) obj.morphTargetInfluences = new Float32Array(Object.keys(obj.morphTargetDictionary).length);
    }
  });

  status.textContent = `Loaded — ${morphMeshes.length > 0 ? Object.keys(morphMeshes[0].morphTargetDictionary).join(', ') : 'No morph targets found'}`;
  setTimeout(() => { status.style.opacity = '0'; }, 3000);

  // Skeleton helper
  skeletonHelper = new THREE.SkeletonHelper(modelRoot);
  skeletonHelper.visible = false;
  scene.add(skeletonHelper);

  controls.target.set(0, 0, 0);
  controls.update();
}, xhr => {
  status.textContent = `Loading… ${Math.round(xhr.loaded / xhr.total * 100)}%`;
}, err => {
  status.textContent = 'Error loading model: ' + err.message;
  console.error(err);
});

// ── Morph target control ──────────────────────────────────────────────────────
let activeMorph = null;
let morphStrength = 1.0;
let talkActive = false, blinkActive = false;
let talkTimer = 0, blinkTimer = 0;
let talkAnimMorphs = null;

document.getElementById('morph-strength').addEventListener('input', e => {
  morphStrength = e.target.value / 100;
  if (activeMorph) applyMorph(activeMorph, morphStrength);
});

function getMorphIdx(name) {
  for (const m of morphMeshes) {
    const idx = m.morphTargetDictionary[name];
    if (idx !== undefined) return { mesh: m, idx };
  }
  return null;
}

function applyMorph(name, strength) {
  const r = getMorphIdx(name);
  if (!r) return;
  r.mesh.morphTargetInfluences[r.idx] = strength;
}

function resetAllMorphs() {
  for (const m of morphMeshes) {
    for (let i = 0; i < m.morphTargetInfluences.length; i++) {
      m.morphTargetInfluences[i] = 0;
    }
  }
}

document.querySelectorAll('[data-morph]').forEach(btn => {
  btn.addEventListener('click', () => {
    const name = btn.dataset.morph;
    talkActive = false; blinkActive = false;
    document.querySelectorAll('.btn.active').forEach(b => b.classList.remove('active'));
    resetAllMorphs();
    if (activeMorph === name) {
      activeMorph = null;
    } else {
      activeMorph = name;
      applyMorph(name, morphStrength);
      btn.classList.add('active');
    }
  });
});

// Talk animation
document.getElementById('anim-talk').addEventListener('click', () => {
  talkActive = !talkActive;
  document.getElementById('anim-talk').classList.toggle('active', talkActive);
  if (!talkActive) {
    applyMorph('A', 0); applyMorph('O', 0);
  }
});

// Auto-blink
document.getElementById('anim-blink').addEventListener('click', () => {
  blinkActive = !blinkActive;
  document.getElementById('anim-blink').classList.toggle('active', blinkActive);
});

document.getElementById('anim-reset').addEventListener('click', () => {
  talkActive = false; blinkActive = false;
  activeMorph = null;
  document.querySelectorAll('.btn.active').forEach(b => b.classList.remove('active'));
  resetAllMorphs();
});

// Camera presets
document.querySelectorAll('[data-cam]').forEach(btn => {
  btn.addEventListener('click', () => {
    const v = btn.dataset.cam;
    if (v === 'front') { camera.position.set(0, 0, 2.5); controls.target.set(0, 0, 0); }
    if (v === 'side')  { camera.position.set(2.5, 0, 0); controls.target.set(0, 0, 0); }
    if (v === 'top')   { camera.position.set(0, 2.5, 0.1); controls.target.set(0, 0, 0); }
    controls.update();
  });
});

document.getElementById('toggle-rotate').addEventListener('click', function() {
  autoRotate = !autoRotate;
  controls.autoRotate = autoRotate;
  this.classList.toggle('active', autoRotate);
});
document.getElementById('toggle-rotate').classList.add('active');

document.getElementById('toggle-skeleton').addEventListener('click', function() {
  if (skeletonHelper) {
    skeletonHelper.visible = !skeletonHelper.visible;
    this.classList.toggle('active', skeletonHelper.visible);
  }
});

// ── Render loop ───────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
let talkPhase = 0;
let blinkCountdown = 3 + Math.random() * 4;

renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();

  // Talk animation — cycle A → O morphs
  if (talkActive) {
    talkPhase += dt * 4;
    const wave = (Math.sin(talkPhase) + 1) / 2;
    const isA = Math.sin(talkPhase * 0.5) > 0;
    applyMorph('A', isA ? wave * 0.9 : 0);
    applyMorph('O', isA ? 0 : wave * 0.7);
  }

  // Auto-blink
  if (blinkActive) {
    blinkCountdown -= dt;
    if (blinkCountdown <= 0) {
      applyMorph('Blink_L', 1);
      applyMorph('Blink_R', 1);
      setTimeout(() => {
        applyMorph('Blink_L', 0);
        applyMorph('Blink_R', 0);
        blinkCountdown = 2 + Math.random() * 5;
      }, 120);
    }
  }

  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
